<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Waypoint — AI Chat</title>
<style>
:root{--bg:#000;--panel:#111;--user:#fff;--ai:#171717;--text:#fff;--muted:#aaa;--border:#2a2a2a}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#app{display:flex;flex-direction:column;height:100dvh;max-width:760px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border);background:#0b0b0b}.left{display:flex;align-items:center;gap:8px}.icon{background:none;border:0;color:#fff;font-size:20px;padding:7px}.brand{display:flex;align-items:center;gap:10px}.mark{width:30px;height:30px;border:1px solid #fff;border-radius:8px;display:grid;place-items:center;font-weight:700}.name{font:18px Georgia}.sub{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.provider{display:flex;gap:6px}.provider button{background:#111;border:1px solid #444;color:#fff;border-radius:9px;padding:7px 9px;font-size:11px}.provider button.active{background:#fff;color:#000}.status{font-size:11px;color:var(--muted)}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#fff;margin-right:5px}.off{background:#666}.messages{flex:1;overflow:auto;padding:18px 15px 8px;display:flex;flex-direction:column;gap:14px}.empty{margin:auto;text-align:center;color:var(--muted)}.empty b{font:38px Georgia;color:#fff}.row{display:flex}.user{justify-content:flex-end}.ai{justify-content:flex-start}.bubble{max-width:84%;padding:11px 14px;border-radius:16px;font-size:15px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}.user .bubble{background:#fff;color:#000;border-bottom-right-radius:4px}.ai .bubble{background:#171717;border:1px solid #303030;border-bottom-left-radius:4px}.error{border-color:#666!important}.typing{display:flex;gap:4px}.typing i{width:6px;height:6px;border-radius:50%;background:#aaa}.input{display:flex;gap:8px;align-items:flex-end;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--border);background:#0b0b0b}textarea{flex:1;resize:none;max-height:120px;background:#050505;border:1px solid #333;color:#fff;border-radius:20px;padding:11px 16px;font:15px inherit;outline:0}.send{width:42px;height:42px;border:0;border-radius:50%;background:#fff;color:#000;font-size:18px}.send:disabled{opacity:.4}.key{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:20px;z-index:50}.key.open{display:flex}.card{width:min(440px,100%);background:#111;border:1px solid #444;border-radius:16px;padding:20px}.card h2{margin:0 0 8px}.card p{color:#aaa;font-size:13px}.card input{width:100%;background:#000;color:#fff;border:1px solid #444;border-radius:10px;padding:12px}.card button{margin-top:10px;padding:10px 14px;border:1px solid #fff;background:#fff;color:#000;border-radius:9px}.side{position:fixed;top:0;left:-285px;width:270px;height:100%;background:#111;border-right:1px solid #333;z-index:40;transition:.2s;padding-top:env(safe-area-inset-top)}.side.open{left:0}.sidehead{padding:16px;border-bottom:1px solid #333;color:#aaa;font-size:12px}.new{margin:10px;width:calc(100% - 20px);padding:11px;background:#fff;color:#000;border:0;border-radius:10px}.list{padding:8px}.item{padding:11px;border-radius:9px;display:flex;justify-content:space-between}.item.active{background:#222}.overlay{position:fixed;inset:0;background:#0009;z-index:30;display:none}.overlay.open{display:block}
</style></head><body>
<div id="overlay" class="overlay" onclick="closeSide()"></div><aside id="side" class="side"><div class="sidehead">Conversations</div><button class="new" onclick="newChat()">+ New chat</button><div id="list" class="list"></div></aside>
<div id="keyModal" class="key"><div class="card"><h2>AI API Key</h2><p>Enter a provider API key. It is stored only on this device.</p><select id="keyProvider" style="width:100%;margin:5px 0 10px;padding:11px;background:#000;color:#fff;border:1px solid #444;border-radius:10px"><option value="anthropic">Anthropic Claude</option><option value="openai">OpenAI ChatGPT</option><option value="gemini">Google Gemini</option></select><input id="keyInput" type="password" placeholder="API key"><button onclick="saveKey()">Save key</button> <button onclick="closeKey()" style="background:#111;color:#fff">Cancel</button></div></div>
<div id="app"><header><div class="left"><button class="icon" onclick="openSide()">☰</button><div class="brand"><div class="mark">W</div><div><div class="name">Waypoint</div><div class="sub">AI Chat</div></div></div></div><div class="provider"><button data-p="anthropic" onclick="setProvider('anthropic')">Claude</button><button data-p="openai" onclick="setProvider('openai')">GPT</button><button data-p="gemini" onclick="setProvider('gemini')">Gemini</button><button class="icon" onclick="openKey()">🔑</button></div></header><main id="messages" class="messages"></main><div class="input"><textarea id="text" rows="1" placeholder="Message Waypoint…"></textarea><button id="send" class="send">➤</button></div></div>
<script>
const KEY=p=>'waypoint-'+p+'-api-key';const MODEL={anthropic:'claude-sonnet-4-20250514',openai:'gpt-4o',gemini:'gemini-1.5-flash'};let provider=localStorage.getItem('waypoint-provider')||'anthropic',chats={},current=null,busy=false;const $=id=>document.getElementById(id);const uid=()=>Date.now()+'_'+Math.random().toString(36).slice(2,7);
function save(){localStorage.setItem('waypoint-chats',JSON.stringify(chats));localStorage.setItem('waypoint-provider',provider)}function load(){try{chats=JSON.parse(localStorage.getItem('waypoint-chats')||'{}')}catch{chats={}};let ids=Object.keys(chats);if(!ids.length)newChat(false);else current=ids.at(-1);renderList();render();updateProvider()}function newChat(draw=true){let id='c_'+uid();chats[id]={title:'New chat',messages:[]};current=id;save();if(draw){renderList();render();closeSide()}}function renderList(){list.innerHTML='';Object.keys(chats).reverse().forEach(id=>{let d=document.createElement('div');d.className='item '+(id===current?'active':'');d.innerHTML='<span>'+esc(chats[id].title)+'</span><span onclick="delChat(\''+id+'\',event)">×</span>';d.onclick=()=>{current=id;render();renderList();closeSide()};list.appendChild(d)})}function delChat(id,e){e.stopPropagation();delete chats[id];let ids=Object.keys(chats);if(!ids.length)newChat(false);else current=ids.at(-1);save();renderList();render()}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function render(){messages.innerHTML='';let c=chats[current];if(!c||!c.messages.length){messages.innerHTML='<div class="empty"><b>W</b><p>Ask anything. Choose Claude, GPT, or Gemini.</p></div>';return}c.messages.forEach(m=>{let r=document.createElement('div');r.className='row '+(m.role==='user'?'user':'ai');let b=document.createElement('div');b.className='bubble '+(m.error?'error':'');b.textContent=m.content;r.appendChild(b);messages.appendChild(r)});messages.scrollTop=messages.scrollHeight}function updateProvider(){document.querySelectorAll('.provider button[data-p]').forEach(b=>b.classList.toggle('active',b.dataset.p===provider))}function setProvider(p){provider=p;save();updateProvider()}function openSide(){side.classList.add('open');overlay.classList.add('open')}function closeSide(){side.classList.remove('open');overlay.classList.remove('open')}function openKey(){keyProvider.value=provider;keyInput.value='';keyModal.classList.add('open')}function closeKey(){keyModal.classList.remove('open')}function saveKey(){let k=keyInput.value.trim();if(!k){localStorage.removeItem(KEY(keyProvider.value));return}localStorage.setItem(KEY(keyProvider.value),k);provider=keyProvider.value;save();updateProvider();closeKey()}function getKey(){return localStorage.getItem(KEY(provider))||''}
async function callAI(msgs){let k=getKey();if(!k){openKey();throw Error('API key required. Tap 🔑 to add one.')}if(provider==='anthropic'){let r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','accept':'application/json','x-api-key':k,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:MODEL.anthropic,max_tokens:1200,messages:msgs})});let d=await r.json();if(!r.ok)throw Error(d.error?.message||'Anthropic request failed');return (d.content||[]).filter(x=>x.type==='text').map(x=>x.text).join('\n')}if(provider==='openai'){let r=await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',headers:{'content-type':'application/json','authorization':'Bearer '+k},body:JSON.stringify({model:MODEL.openai,messages:msgs,max_tokens:1200})});let d=await r.json();if(!r.ok)throw Error(d.error?.message||'OpenAI request failed');return d.choices?.[0]?.message?.content||''}let r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+MODEL.gemini+':generateContent',{method:'POST',headers:{'content-type':'application/json','x-goog-api-key':k},body:JSON.stringify({contents:msgs.map(m=>({role:m.role==='assistant'?'model':'user',parts:[{text:String(m.content)}]}))})});let d=await r.json();if(!r.ok)throw Error(d.error?.message||'Gemini request failed');return d.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('')||''}
async function send(){if(busy)return;let t=text.value.trim();if(!t)return;let c=chats[current];c.messages.push({role:'user',content:t});if(c.title==='New chat')c.title=t.slice(0,40);text.value='';save();renderList();render();busy=true;send.disabled=true;try{let reply=await callAI(c.messages.filter(m=>!m.error).map(m=>({role:m.role,content:m.content})));if(!reply)throw Error('Empty AI response');c.messages.push({role:'assistant',content:reply})}catch(e){c.messages.push({role:'assistant',content:e.message,error:true})}busy=false;send.disabled=false;save();render()}send.onclick=send;text.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};text.oninput=e=>{e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,120)+'px'};load();
</script></body></html>

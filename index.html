<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Waypoint — AI Chat</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#10131a">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--bg:#10131a;--panel:#171b24;--user:#2a3142;--ai:#1c212c;--accent:#e8a33d;--dim:#8b92a3;--border:#262c39;--danger:#d9694f;--text:#eceef2}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI",Roboto,system-ui,sans-serif}#app{display:flex;flex-direction:column;height:100dvh;max-width:720px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border);background:var(--panel);flex-shrink:0}.left{display:flex;align-items:center;gap:10px}.icon{background:none;border:0;color:var(--dim);font-size:20px;padding:6px}.brand{display:flex;align-items:center;gap:10px}.mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#7a5a22);display:grid;place-items:center;color:#10131a;font:bold 15px Georgia}.name{font:18px Georgia}.sub{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}.status{font-size:11px;color:var(--dim)}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#4caf6d;margin-right:6px}.dot.off{background:var(--danger)}#messages{flex:1;overflow:auto;padding:18px 16px 8px;display:flex;flex-direction:column;gap:14px}.empty{margin:auto;text-align:center;color:var(--dim);padding:30px}.empty b{font:34px Georgia;color:var(--accent)}.row{display:flex}.row.user{justify-content:flex-end}.row.ai{justify-content:flex-start}.bubble{max-width:82%;padding:11px 14px;border-radius:16px;font-size:15px;line-height:1.48;white-space:pre-wrap;overflow-wrap:anywhere}.user .bubble{background:var(--user);border-bottom-right-radius:4px}.ai .bubble{background:var(--ai);border:1px solid var(--border);border-bottom-left-radius:4px}.error{background:#2a1a18!important;border-color:#4a2c26!important;color:#e0a396}.typing{display:flex;gap:4px}.typing i{width:6px;height:6px;border-radius:50%;background:var(--dim);animation:b 1.2s infinite}.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}#input{display:flex;gap:8px;align-items:flex-end;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--border);background:var(--panel)}textarea{flex:1;resize:none;max-height:120px;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:20px;padding:11px 16px;font:15px inherit;outline:0}#send{width:42px;height:42px;border:0;border-radius:50%;background:var(--accent);font-size:18px}#send:disabled{opacity:.4}#side{position:fixed;top:0;left:-280px;width:260px;height:100%;background:var(--panel);border-right:1px solid var(--border);z-index:30;transition:left .2s;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}#side.open{left:0}#overlay{position:fixed;inset:0;background:#0008;z-index:20;display:none}#overlay.open{display:block}.sidehead{padding:16px;border-bottom:1px solid var(--border);font-size:12px;color:var(--dim);text-transform:uppercase}.new{margin:10px;padding:11px;background:var(--accent);border:0;border-radius:10px;font-weight:600}#list{flex:1;overflow:auto;padding:8px}.item{padding:11px 12px;border-radius:10px;display:flex;justify-content:space-between;gap:6px;font-size:13px}.item.active,.item:active{background:var(--user)}.del{color:var(--dim)}.foot{padding:12px 16px;border-top:1px solid var(--border);font-size:11px;color:var(--dim)}
</style></head>
<body>
<div id="overlay" onclick="closeSide()"></div><aside id="side"><div class="sidehead">Conversations</div><button class="new" onclick="newChat()">+ New chat</button><div id="list"></div><div class="foot">Saved on this device.<br>AI chat requires internet.</div></aside>
<div id="app"><header><div class="left"><button class="icon" onclick="openSide()">☰</button><div class="brand"><div class="mark">W</div><div><div class="name">Waypoint</div><div class="sub">AI Chat</div></div></div></div><div class="status"><span id="dot" class="dot"></span><span id="status">Online</span></div></header><main id="messages"></main><div id="input"><textarea id="text" rows="1" placeholder="Message Waypoint…"></textarea><button id="send">➤</button></div></div>
<script>
let chats={},current=null,busy=false;
const $=id=>document.getElementById(id);
const uid=()=>`c_${Date.now()}_${Math.random().toString(36).slice(2,8)}`;
function persist(){try{localStorage.setItem('waypoint-chats',JSON.stringify(chats))}catch(e){}}
function load(){try{chats=JSON.parse(localStorage.getItem('waypoint-chats')||'{}')}catch(e){chats={}};let ids=Object.keys(chats);if(!ids.length)newChat(false);else current=ids[ids.length-1];renderList();render()}
function newChat(draw=true){let id=uid();chats[id]={title:'New chat',messages:[]};current=id;persist();if(draw){renderList();render();closeSide()}}
function switchChat(id){current=id;renderList();render();closeSide()}
function delChat(id,e){e.stopPropagation();delete chats[id];let ids=Object.keys(chats);if(!ids.length)newChat(false);else if(current===id)current=ids[ids.length-1];persist();renderList();render()}
function renderList(){let l=$('list');l.innerHTML='';Object.keys(chats).reverse().forEach(id=>{let d=document.createElement('div');d.className='item'+(id===current?' active':'');d.onclick=()=>switchChat(id);let t=document.createElement('span');t.textContent=chats[id].title||'New chat';t.style.overflow='hidden';t.style.textOverflow='ellipsis';let x=document.createElement('span');x.className='del';x.textContent='✕';x.onclick=e=>delChat(id,e);d.append(t,x);l.appendChild(d)})}
function render(){let c=$('messages');c.innerHTML='';let chat=chats[current];if(!chat||!chat.messages.length){c.innerHTML='<div class="empty"><b>W</b><p>Ask anything. Waypoint responds using Claude.</p></div>';return}chat.messages.forEach(m=>{let r=document.createElement('div');r.className='row '+(m.role==='user'?'user':'ai');let b=document.createElement('div');b.className='bubble '+(m.role==='user'?'user':m.error?'error':'ai');b.textContent=m.content;r.appendChild(b);c.appendChild(r)});c.scrollTop=c.scrollHeight}
function openSide(){$('side').classList.add('open');$('overlay').classList.add('open')}function closeSide(){$('side').classList.remove('open');$('overlay').classList.remove('open')}
function status(){let on=navigator.onLine;$('dot').className='dot'+(on?'':' off');$('status').textContent=on?'Online':'Offline'}
async function send(){if(busy)return;let input=$('text'),text=input.value.trim();if(!text)return;if(!navigator.onLine){status();chats[current].messages.push({role:'assistant',content:'You are offline. Connect to the internet and try again.',error:true});render();return}let chat=chats[current];chat.messages.push({role:'user',content:text});if(chat.title==='New chat')chat.title=text.slice(0,40);input.value='';input.style.height='auto';persist();renderList();render();busy=true;$('send').disabled=true;let typing=document.createElement('div');typing.id='typing';typing.className='row ai';typing.innerHTML='<div class="bubble ai"><div class="typing"><i></i><i></i><i></i></div></div>';$('messages').appendChild(typing);$('messages').scrollTop=$('messages').scrollHeight;try{let messages=chat.messages.filter(m=>!m.error).map(m=>({role:m.role,content:m.content}));let r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages})});let data=await r.json();if(!r.ok)throw new Error(data.error||'AI request failed');let reply=(data.content||[]).filter(x=>x.type==='text').map(x=>x.text).join('\n');if(!reply)throw new Error('Empty AI response');$('typing')?.remove();chat.messages.push({role:'assistant',content:reply})}catch(e){$('typing')?.remove();chat.messages.push({role:'assistant',content:'Something went wrong reaching the AI. Please try again.',error:true});console.error(e)}busy=false;$('send').disabled=false;persist();render()}
$('send').onclick=send;$('text').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};$('text').oninput=e=>{e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,120)+'px'};addEventListener('online',status);addEventListener('offline',status);status();load();
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Waypoint — AI Chat</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#10131a">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Waypoint">
<style>
  :root {
    --bg: #10131a;
    --bg-panel: #171b24;
    --bg-bubble-user: #2a3142;
    --bg-bubble-ai: #1c212c;
    --accent: #e8a33d;
    --accent-dim: #7a5a22;
    --text: #eceef2;
    --text-dim: #8b92a3;
    --border: #262c39;
    --danger: #d9694f;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    max-width: 720px;
    margin: 0 auto;
    position: relative;
  }

  /* HEADER */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-panel);
    flex-shrink: 0;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .brand-mark {
    width: 30px; height: 30px;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--accent), var(--accent-dim));
    display: flex; align-items: center; justify-content: center;
    font-family: Georgia, serif;
    font-weight: 700;
    font-size: 15px;
    color: #10131a;
  }
  .brand-name {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 18px;
    letter-spacing: 0.02em;
  }
  .brand-sub {
    font-size: 10.5px;
    color: var(--text-dim);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-top: -2px;
  }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #4caf6d;
    display: inline-block;
    margin-right: 6px;
    box-shadow: 0 0 6px #4caf6d88;
  }
  .status-dot.offline { background: var(--danger); box-shadow: 0 0 6px #d9694f88; }
  #statusText { font-size: 11.5px; color: var(--text-dim); display:flex; align-items:center; }
  .icon-btn {
    background: none; border: none; color: var(--text-dim);
    font-size: 18px; cursor: pointer; padding: 6px;
    border-radius: 8px;
  }
  .icon-btn:active { background: var(--border); }

  /* MESSAGES */
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 18px 16px 8px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .empty-state {
    margin: auto;
    text-align: center;
    color: var(--text-dim);
    padding: 0 30px;
  }
  .empty-state .em-mark {
    font-family: Georgia, serif;
    font-size: 34px;
    color: var(--accent);
    margin-bottom: 6px;
  }
  .empty-state p { font-size: 13.5px; line-height: 1.5; }

  .bubble-row { display: flex; }
  .bubble-row.user { justify-content: flex-end; }
  .bubble-row.ai { justify-content: flex-start; }
  .bubble {
    max-width: 82%;
    padding: 11px 14px;
    border-radius: 16px;
    font-size: 15px;
    line-height: 1.48;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .bubble.user {
    background: var(--bg-bubble-user);
    border-bottom-right-radius: 4px;
  }
  .bubble.ai {
    background: var(--bg-bubble-ai);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .bubble.error {
    background: #2a1a18;
    border: 1px solid #4a2c26;
    color: #e0a396;
  }
  .typing {
    display: flex; gap: 4px; padding: 4px 2px;
  }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--text-dim);
    animation: blink 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }

  /* INPUT */
  #inputBar {
    flex-shrink: 0;
    display: flex;
    align-items: flex-end;
    gap: 8px;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--border);
    background: var(--bg-panel);
  }
  #textInput {
    flex: 1;
    resize: none;
    max-height: 120px;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 20px;
    padding: 11px 16px;
    font-size: 15px;
    font-family: inherit;
    outline: none;
    line-height: 1.4;
  }
  #textInput:focus { border-color: var(--accent-dim); }
  #sendBtn {
    background: var(--accent);
    border: none;
    color: #17130a;
    width: 42px; height: 42px;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 0.15s;
  }
  #sendBtn:disabled { opacity: 0.4; }

  /* SIDEBAR */
  #sidebar {
    position: fixed;
    top: 0; left: -280px;
    width: 260px; height: 100%;
    background: var(--bg-panel);
    border-right: 1px solid var(--border);
    transition: left 0.22s ease;
    z-index: 30;
    display: flex;
    flex-direction: column;
    padding-top: env(safe-area-inset-top);
  }
  #sidebar.open { left: 0; }
  #overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 20;
    display: none;
  }
  #overlay.open { display: block; }
  .sidebar-header {
    padding: 16px; border-bottom: 1px solid var(--border);
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--text-dim);
  }
  #chatList { flex: 1; overflow-y: auto; padding: 8px; }
  .chat-item {
    padding: 11px 12px;
    border-radius: 10px;
    font-size: 13.5px;
    color: var(--text);
    cursor: pointer;
    margin-bottom: 2px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
  }
  .chat-item:active, .chat-item.active { background: var(--bg-bubble-user); }
  .chat-item .del {
    color: var(--text-dim); font-size: 12px; opacity: 0.6; flex-shrink: 0;
  }
  .new-chat-btn {
    margin: 10px;
    padding: 11px;
    background: var(--accent);
    color: #17130a;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .sidebar-footer {
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--text-dim);
    line-height: 1.5;
  }
</style>
</head>
<body>
<div id="overlay" onclick="closeSidebar()"></div>
<div id="sidebar">
  <div class="sidebar-header">Conversations</div>
  <button class="new-chat-btn" onclick="newChat()">+ New chat</button>
  <div id="chatList"></div>
  <div class="sidebar-footer">
    Saved on this device.<br>Chat needs internet — it's cached here so you can still read it offline.
  </div>
</div>

<div id="app">
  <header>
    <div style="display:flex; align-items:center; gap:10px;">
      <button class="icon-btn" onclick="openSidebar()">☰</button>
      <div class="brand">
        <div class="brand-mark">W</div>
        <div>
          <div class="brand-name">Waypoint</div>
          <div class="brand-sub">AI Chat</div>
        </div>
      </div>
    </div>
    <div id="statusText"><span class="status-dot" id="statusDot"></span><span id="statusLabel">Online</span></div>
  </header>

  <div id="messages"></div>

  <div id="inputBar">
    <textarea id="textInput" rows="1" placeholder="Message Waypoint…" onkeydown="handleKeydown(event)" oninput="autoGrow(this)"></textarea>
    <button id="sendBtn" onclick="sendMessage()">➤</button>
  </div>
</div>

<script>
let currentChatId = null;
let chats = {}; // id -> {title, messages: [{role, content}]}
let isSending = false;

function uid() { return 'c_' + Date.now() + '_' + Math.random().toString(36).slice(2,8); }

async function loadChats() {
  try {
    const res = await window.storage.get('chats-index', false);
    if (res && res.value) {
      chats = JSON.parse(res.value);
    }
  } catch (e) {
    chats = {};
  }
  const ids = Object.keys(chats);
  if (ids.length === 0) {
    newChat(false);
  } else {
    currentChatId = ids[ids.length - 1];
  }
  renderChatList();
  renderMessages();
}

async function saveChats() {
  try {
    await window.storage.set('chats-index', JSON.stringify(chats), false);
  } catch (e) {
    console.error('Save failed', e);
  }
}

function newChat(doRender = true) {
  const id = uid();
  chats[id] = { title: 'New chat', messages: [] };
  currentChatId = id;
  saveChats();
  if (doRender) { renderChatList(); renderMessages(); closeSidebar(); }
}

function switchChat(id) {
  currentChatId = id;
  renderChatList();
  renderMessages();
  closeSidebar();
}

function deleteChat(id, evt) {
  evt.stopPropagation();
  delete chats[id];
  if (Object.keys(chats).length === 0) {
    newChat(false);
  } else if (currentChatId === id) {
    currentChatId = Object.keys(chats)[Object.keys(chats).length - 1];
  }
  saveChats();
  renderChatList();
  renderMessages();
}

function renderChatList() {
  const list = document.getElementById('chatList');
  list.innerHTML = '';
  Object.keys(chats).slice().reverse().forEach(id => {
    const div = document.createElement('div');
    div.className = 'chat-item' + (id === currentChatId ? ' active' : '');
    div.onclick = () => switchChat(id);
    const titleSpan = document.createElement('span');
    titleSpan.textContent = chats[id].title || 'New chat';
    titleSpan.style.overflow = 'hidden';
    titleSpan.style.textOverflow = 'ellipsis';
    const delSpan = document.createElement('span');
    delSpan.className = 'del';
    delSpan.textContent = '✕';
    delSpan.onclick = (e) => deleteChat(id, e);
    div.appendChild(titleSpan);
    div.appendChild(delSpan);
    list.appendChild(div);
  });
}

function renderMessages() {
  const container = document.getElementById('messages');
  container.innerHTML = '';
  const chat = chats[currentChatId];
  if (!chat || chat.messages.length === 0) {
    container.innerHTML = `<div class="empty-state">
      <div class="em-mark">W</div>
      <p>Ask anything. Waypoint responds using Claude, and keeps your conversation saved on this device.</p>
    </div>`;
    return;
  }
  chat.messages.forEach(m => {
    const row = document.createElement('div');
    row.className = 'bubble-row ' + (m.role === 'user' ? 'user' : 'ai');
    const bubble = document.createElement('div');
    bubble.className = 'bubble ' + (m.role === 'user' ? 'user' : (m.error ? 'error' : 'ai'));
    bubble.textContent = m.content;
    row.appendChild(bubble);
    container.appendChild(row);
  });
  container.scrollTop = container.scrollHeight;
}

function autoGrow(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function handleKeydown(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function openSidebar() {
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('overlay').classList.add('open');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
}

function setStatus(online) {
  document.getElementById('statusDot').className = 'status-dot' + (online ? '' : ' offline');
  document.getElementById('statusLabel').textContent = online ? 'Online' : 'Offline — showing saved chats';
}

window.addEventListener('online', () => setStatus(true));
window.addEventListener('offline', () => setStatus(false));

async function sendMessage() {
  if (isSending) return;
  const input = document.getElementById('textInput');
  const text = input.value.trim();
  if (!text) return;

  if (!navigator.onLine) {
    setStatus(false);
    const chat = chats[currentChatId];
    chat.messages.push({ role: 'assistant', content: "You're offline right now, so I can't reach the AI. You can still read your saved conversations — this message will go through once you're back online.", error: true });
    renderMessages();
    return;
  }

  const chat = chats[currentChatId];
  chat.messages.push({ role: 'user', content: text });
  if (chat.title === 'New chat') {
    chat.title = text.slice(0, 40);
  }
  input.value = '';
  autoGrow(input);
  renderMessages();
  saveChats();
  renderChatList();

  isSending = true;
  document.getElementById('sendBtn').disabled = true;

  const container = document.getElementById('messages');
  const typingRow = document.createElement('div');
  typingRow.className = 'bubble-row ai';
  typingRow.id = 'typingRow';
  typingRow.innerHTML = `<div class="bubble ai"><div class="typing"><span></span><span></span><span></span></div></div>`;
  container.appendChild(typingRow);
  container.scrollTop = container.scrollHeight;

  try {
    const apiMessages = chat.messages
      .filter(m => !m.error)
      .map(m => ({ role: m.role, content: m.content }));

    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        messages: apiMessages
      })
    });
    const data = await response.json();
    const replyText = (data.content || [])
      .map(block => block.type === 'text' ? block.text : '')
      .filter(Boolean)
      .join('\n');

    document.getElementById('typingRow')?.remove();
    chat.messages.push({ role: 'assistant', content: replyText || "I couldn't generate a response — try again." });
  } catch (err) {
    document.getElementById('typingRow')?.remove();
    chat.messages.push({ role: 'assistant', content: "Something went wrong reaching the AI. Please try again.", error: true });
  }

  isSending = false;
  document.getElementById('sendBtn').disabled = false;
  renderMessages();
  saveChats();
}

setStatus(navigator.onLine);
loadChats();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>

name: Build Waypoint APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js icon-180.png icon-192.png icon-512.png icon-512-maskable.png key-access.js www/

      - name: Initialize Capacitor
        run: npx cap init "Waypoint" "com.mohammedaarash.waypoint" --web-dir www

      - name: Configure Capacitor for local APK assets
        run: |
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('capacitor.config.json','utf8')); delete p.server; fs.writeFileSync('capacitor.config.json',JSON.stringify(p,null,2));"

      - name: Recreate Android platform
        run: |
          rm -rf android
          npx cap add android

      - name: Copy web assets
        run: npx cap copy android

      - name: Set Android app label
        run: |
          sed -i 's/android:label="@string\/app_name"/android:label="Waypoint"/' android/app/src/main/AndroidManifest.xml || true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Build installable debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Waypoint-Full-Working-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
